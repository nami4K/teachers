<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>성적을 부탁해 티처스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0; --paper:#FFFFFF; --ink:#26324F; --muted:#7A8199; --line:#EFE6D8;
  --pink:#EF5B8A; --pink-2:#F7A1C0; --pink-soft:#FDE3EC;
  --navy:#1F2B5B; --blue:#3B7DD8; --blue-soft:#E3EEFC;
  --yellow:#FFC93C; --yellow-soft:#FFF4CC; --green:#2FA36B; --green-soft:#DDF4E8;
  --red:#E0493E; --radius:18px; --shadow:0 3px 0 rgba(31,43,91,.08), 0 8px 24px rgba(31,43,91,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Gowun Dodum',system-ui,sans-serif; color:var(--ink); font-size:15px; line-height:1.55;
  background:var(--bg);
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, rgba(59,125,216,.07) 31px 32px);
  min-height:100vh;
}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.2px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
main{padding:14px 0 120px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* header & nav */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:'Jua';font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:#FFC93C;line-height:1;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-family:'Jua';white-space:nowrap}
.chip.dday{background:var(--pink);color:#fff}
.chip.timer{background:var(--yellow);color:var(--navy)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
header .iconbtn{color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0 4px}
nav.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);font-family:'Jua'}
nav.tabs button .ic{font-size:22px;line-height:1.1;filter:grayscale(.8);opacity:.7}
nav.tabs button.on{color:var(--pink)}
nav.tabs button.on .ic{filter:none;opacity:1;transform:translateY(-1px)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(239,91,138,.35);border:3px solid var(--pink-2);padding:4px}
.fab .badge{position:absolute;top:-4px;right:-4px;background:var(--yellow);color:var(--navy);font-family:'Jua';font-size:11px;border-radius:999px;padding:1px 6px}

/* cards */
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card.pink{background:var(--pink-soft);border-color:#F8C9D8}
.card.blue{background:var(--blue-soft);border-color:#C8DBF6}
.card.yellow{background:var(--yellow-soft);border-color:#F4E1A0}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec-title h2{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-family:'Jua';font-size:16px;background:var(--pink);color:#fff;box-shadow:0 3px 0 #C73E6C;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C73E6C}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #255EAF}
.btn.navy{background:var(--navy);box-shadow:0 3px 0 #0F1737}
.btn.yellow{background:var(--yellow);color:var(--navy);box-shadow:0 3px 0 #D9A51E}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.input:focus{border-color:var(--pink-2)}
.input.sm{padding:8px 10px;font-size:14px}
.bar{height:12px;border-radius:999px;background:#F1ECE3;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),#FF8FB1);transition:width .5s}
.bar.blue > i{background:linear-gradient(90deg,var(--blue),#6FA7F0)}
.bar.yellow > i{background:linear-gradient(90deg,#F6B91A,var(--yellow))}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;background:#F3EEE6;color:var(--muted)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.wait{background:var(--yellow-soft);color:#A07400}
.tag.no{background:#FCE3E1;color:var(--red)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .big{font-size:44px}

/* mascot */
.hero{display:flex;gap:12px;align-items:flex-end}
.hero svg{width:92px;height:92px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.bubble{position:relative;background:#fff;border:2px solid var(--pink-2);border-radius:16px;padding:10px 12px;font-size:14px;flex:1;margin-bottom:18px;cursor:pointer}
.bubble:after{content:'';position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-left:2px solid var(--pink-2);border-bottom:2px solid var(--pink-2);transform:rotate(45deg)}

/* level */
.lv{display:flex;gap:14px;align-items:center}
.lv .emo{font-size:46px;width:64px;height:64px;display:grid;place-items:center;background:rgba(255,255,255,.12);border-radius:18px}
.lv .name{font-family:'Jua';font-size:22px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats3 div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center}
.stats3 b{display:block;font-family:'Jua';font-size:18px;font-weight:400;color:var(--yellow)}
.stats3 span{font-size:12px;opacity:.85}

/* missions */
.mission{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.mission:last-child{border-bottom:0}
.mission .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
.mission.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.mission.done .t{color:var(--muted);text-decoration:line-through}
.xp{font-family:'Jua';color:var(--pink);font-size:14px;white-space:nowrap}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:11.5px;line-height:1.3}
.bdg .e{font-size:28px;display:block}
.bdg.off{opacity:.45}
.bdg.off .e{filter:grayscale(1)}

/* timer */
.subjects{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.sbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sbtn:disabled{opacity:.45}
.ring{position:relative;width:250px;height:250px;margin:14px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-family:'Jua';font-size:46px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.ring .sub{font-size:14px;color:var(--muted)}
.tbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tbtns .btn{min-width:108px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.week .col i{display:block;width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--blue-soft);margin:3px 0}
.week .col.today i{background:var(--pink)}
.week .col b{font-weight:400;font-size:10.5px;color:var(--ink)}

/* upload */
.upl .pv{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-height:280px;display:flex;justify-content:center;background:#fafafa}
.upl .pv img{max-width:100%;max-height:280px;object-fit:contain}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}

/* rounds */
.subj-head{display:flex;align-items:center;gap:10px;cursor:pointer}
.subj-head .nm{font-family:'Jua';font-size:19px}
.rgrid{width:100%;border-collapse:separate;border-spacing:4px;margin-top:10px;table-layout:fixed}
.rgrid th{font-size:12px;font-weight:400;color:var(--muted);padding:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgrid th.u{text-align:left;width:38%}
.rgrid td.u{font-size:13px;line-height:1.3;word-break:keep-all;padding-right:4px}
.rcell{width:100%;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:'Jua';font-size:17px;color:var(--muted);position:relative}
.rcell[data-n="1"]{background:#FFE9F0;border-color:#F9C4D5;color:var(--pink)}
.rcell[data-n="2"]{background:#FFC8DA;border-color:#F7A1C0;color:#C73E6C}
.rcell.goal{background:var(--pink);border-color:var(--pink);color:#fff}
.rcell.goal:after{content:'★';position:absolute;top:-7px;right:-4px;font-size:13px;color:var(--yellow);text-shadow:0 0 2px #fff}
.minus-on .rcell{border-style:dashed}
.toggle{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px}
.toggle button{padding:6px 12px;border-radius:9px;font-size:13px;font-family:'Jua'}
.toggle button.on{background:var(--navy);color:#fff}

/* ranking */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-family:'Jua';font-size:14px}
.seg button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:6px;background:#fff;border:1px solid var(--line)}
.rk.me{border:2px solid var(--pink);background:var(--pink-soft)}
.rk .no{width:34px;text-align:center;font-family:'Jua';font-size:18px}
.rk .val{font-family:'Jua';font-size:16px;color:var(--navy)}
.rk.top1{background:linear-gradient(90deg,#FFF4CC,#fff)}

/* tips */
.tipgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipc{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;box-shadow:var(--shadow);min-height:96px}
.tipc .e{font-size:28px;display:block;margin-bottom:4px}
.tipc .t{font-family:'Jua';font-size:15px;line-height:1.3}
.tipc .new{position:absolute;top:10px;right:10px;background:var(--pink);color:#fff;font-family:'Jua';font-size:10.5px;border-radius:999px;padding:1px 7px}
.tipc.read{opacity:.8}
.tipbody ul,.tipbody ol{padding-left:20px;margin:6px 0}
.tipbody li{margin:5px 0}
.tipbody .pt{background:var(--yellow-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.tipbody .steps{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tipbody .steps div{background:var(--blue-soft);border-radius:10px;padding:8px 10px}
.pen{display:inline-block;padding:1px 8px;border-radius:6px;margin:2px 0;font-size:14px}

/* availability grid */
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:2px solid transparent;background:#fff;font-size:13px;box-shadow:0 1px 0 var(--line)}
.palette button.on{border-color:var(--navy)}
.palette i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.agrid-wrap{background:#fff;border-radius:14px;border:1px solid var(--line);padding:6px 4px;margin-top:10px}
.agrid{width:100%;border-collapse:collapse;table-layout:fixed;user-select:none;-webkit-user-select:none}
.agrid th{font-size:12px;font-weight:400;padding:4px 0;color:var(--muted)}
.agrid td{height:22px;border:1px solid #F1ECE3;padding:0}
.agrid td.tl{border:0;font-size:10.5px;color:var(--muted);text-align:right;padding-right:4px;vertical-align:top;line-height:1;width:40px;touch-action:pan-y}
.agrid td.c{cursor:pointer}
.paint .agrid td.c{touch-action:none}
.agrid tr.hour td.c{border-top:1.5px solid #E2D9CA}
.c-S{background:#B9C7EE}.c-A{background:#D4B8F0}.c-E{background:#FFD6A8}.c-R{background:#D7D7DE}.c-F{background:#FF9FBF}
.sumrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;text-align:center;font-size:11px}
.sumrow div{background:var(--pink-soft);border-radius:8px;padding:4px 0}
.sumrow b{display:block;font-family:'Jua';font-weight:400;font-size:13px;color:var(--pink)}

/* setup */
.step{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.step .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:'Jua';font-size:20px;background:var(--pink-soft);color:var(--pink);flex:none}
.step.done .n{background:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);border-radius:10px;padding:5px 6px 5px 10px;font-size:14px}
.chipx button{width:22px;height:22px;border-radius:50%;font-size:13px;color:var(--muted)}
.chipx.book{background:var(--yellow-soft)}
.subjform{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* timer extras */
.sw{width:50px;height:30px;border-radius:999px;background:#DDD6CA;position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--navy)}
.sw.on:after{left:23px}
.sw:disabled{opacity:.5}
.focusbar{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:14px;padding:10px 12px;margin-top:12px}
.list .it.sub{padding:6px 0 6px 14px;font-size:13px;border-bottom:1px dashed var(--line)}

/* games */
.gamec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.gamec .e{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--pink-soft);flex:none}
.gamec:disabled{opacity:.5}
.typebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw{padding:4px 10px;border-radius:999px;font-size:14px;background:#FCE3E1;color:var(--red)}
.kw.hit{background:var(--green-soft);color:var(--green)}
.model{background:var(--yellow-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14.5px;line-height:1.6}
.result.half{background:var(--yellow-soft)}
.qphoto{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:#F4F1EA;min-height:150px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;border:1px solid var(--line)}
.qphoto img{width:100%;max-height:360px;object-fit:contain;display:block}
.qphoto .zoomtag{position:absolute;right:8px;bottom:8px;background:rgba(31,43,91,.85);color:#fff;font-size:12.5px;border-radius:999px;padding:4px 11px}
.zoom{position:fixed;inset:0;z-index:90;background:#0B0F1E;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.zoom img{max-width:100%;max-height:100%;transform-origin:center center;-webkit-user-drag:none;will-change:transform;pointer-events:none}
.zoom .zbar{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}
.zoom .zbar button{background:rgba(255,255,255,.95);color:var(--navy);font-family:'Jua';font-size:19px;min-width:50px;height:46px;border-radius:13px;padding:0 14px;white-space:nowrap}
.zoom .zhint{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;opacity:.85;font-size:13px;padding:0 16px}
.typebtns button{padding:8px 2px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:11.5px;line-height:1.25}
.typebtns button b{display:block;font-size:22px;font-weight:400}
.typebtns button.on{border-color:var(--pink);background:var(--pink-soft)}
textarea.input{resize:vertical;min-height:48px}
.qprompt{font-size:18px;line-height:1.6;white-space:pre-line;margin:10px 0 0;word-break:keep-all}
.choices{display:grid;gap:8px;margin-top:14px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{padding:13px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:16px;text-align:left;box-shadow:0 2px 0 var(--line)}
.choice.ox{font-size:36px;text-align:center;padding:14px}
.choice.right{background:var(--green-soft);border-color:var(--green)}
.choice.wrong{background:#FCE3E1;border-color:var(--red)}
.result{border-radius:14px;padding:12px 14px;margin-top:14px}
.result.ok{background:var(--green-soft)}
.result.no{background:#FCE3E1}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{height:96px;border-radius:14px;background:var(--pink);color:#fff;font-family:'Jua';font-size:28px;display:grid;place-items:center;padding:6px;box-shadow:0 3px 0 #C73E6C;overflow:hidden;word-break:keep-all}
.mcard.open{background:var(--blue-soft);color:var(--ink);font-family:'Gowun Dodum';font-size:13px;line-height:1.3;border:2px solid var(--blue);box-shadow:none}
.mcard.open.m{border-color:#E6B325;background:var(--yellow-soft)}
.mcard.done{background:var(--green-soft);border:2px solid var(--green);color:var(--green)}
.answerline{background:var(--blue-soft);border-radius:14px;padding:10px;min-height:60px;border:2px dashed #C8DBF6;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tok{padding:8px 11px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:16px;box-shadow:0 2px 0 var(--line)}
.tok.used{visibility:hidden}

/* modal, toast, confetti */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(20,26,50,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.modal .x{float:right;font-size:22px;width:36px;height:36px;margin:-6px -6px 0 0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:toast 2.6s forwards}
.toast.xp{background:var(--pink);font-family:'Jua';font-size:17px}
.toast.err{background:var(--red)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.confetti{position:fixed;top:-12px;z-index:70;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.levelup{text-align:center;padding:10px 0}
.levelup .e{font-size:84px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}}
.spinner{width:36px;height:36px;border:4px solid var(--pink-soft);border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.demo{background:var(--yellow);color:var(--navy);text-align:center;font-size:12.5px;padding:5px 10px}

/* login */
.login-hero{text-align:center;padding:30px 0 10px}
.login-hero svg{width:130px;height:130px;display:block;margin:0 auto 6px}
.login-hero .sub{font-family:'Jua';color:var(--pink);font-size:17px}
.login-hero h1{font-size:38px;margin:0;color:var(--navy);line-height:1.1}
.login-hero .tag2{display:inline-block;background:var(--navy);color:#FFF4CC;border-radius:10px;padding:3px 12px;font-family:'Jua';font-size:14px;margin-bottom:8px}
.linkbtn{color:var(--blue);text-decoration:underline;font-size:14px;padding:6px}

/* admin */
.atable{width:100%;border-collapse:collapse;font-size:13px}
.atable th,.atable td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
.atable td:first-child,.atable th:first-child{text-align:left}
.photo-card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.photo-card .th{width:92px;height:92px;border-radius:10px;background:#eee center/cover;flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.photo-card .th img{width:100%;height:100%;object-fit:cover}

function compressImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('사진을 읽을 수 없어요. 다른 사진으로 해 볼래요?'));
    img.src = URL.createObjectURL(file);
  });
}

  return a;
}

const Zoom = {
  el: null,
  open(src) {
    this.close();
    const el = this.el = document.createElement('div');
    el.className = 'zoom';
    el.innerHTML = `<div class="zhint">두 손가락으로 벌리거나 두 번 톡 치면 커져요 · 커진 뒤엔 끌어서 움직여요</div>
      <img alt="문제 사진"><div class="zbar"><button data-z="out" aria-label="작게">－</button><button data-z="reset" aria-label="원래대로">⟲</button><button data-z="in" aria-label="크게">＋</button><button data-z="close">✕ 닫기</button></div>`;
    document.body.appendChild(el);
    const img = el.querySelector('img');
    img.src = src;
    let s = 1, x = 0, y = 0, pinch = null, drag = null, lastTap = 0;
    const pts = new Map();
    const apply = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
    // (cx, cy) 지점이 손가락 아래 그대로 있도록 확대해요
    const zoomAt = (ns, cx, cy) => {
      ns = Math.min(6, Math.max(1, ns));
      const r = el.getBoundingClientRect(), ox = cx - r.width / 2, oy = cy - r.height / 2;
      x = ox - (ox - x) * ns / s; y = oy - (oy - y) * ns / s; s = ns;
      if (s === 1) { x = 0; y = 0; }
      apply();
    };
    const center = () => { const r = el.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
    const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
    const mid = () => { const [a, b] = [...pts.values()]; return [(a.x + b.x) / 2, (a.y + b.y) / 2]; };
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.zbar')) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (pts.size === 2) { pinch = { d:dist(), s }; drag = null; lastTap = 0; return; }
      const now = Date.now();
      if (now - lastTap < 300) { zoomAt(s > 1 ? 1 : 2.5, e.clientX, e.clientY); lastTap = 0; }
      else lastTap = now;
      drag = { x:e.clientX, y:e.clientY, ox:x, oy:y };
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (pts.size === 2 && pinch) { const [mx, my] = mid(); zoomAt(pinch.s * dist() / pinch.d, mx, my); }
      else if (drag) {
        if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) lastTap = 0; // 끌기는 톡이 아니에요
        if (s > 1) { x = drag.ox + e.clientX - drag.x; y = drag.oy + e.clientY - drag.y; apply(); }
      }
    });
    const up = e => {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 1) { const p = [...pts.values()][0]; drag = { x:p.x, y:p.y, ox:x, oy:y }; }
      if (!pts.size) drag = null;
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive:false });
    el.querySelector('.zbar').addEventListener('click', e => {
      const b = e.target.closest('[data-z]'); if (!b) return;
      const [cx, cy] = center();
      if (b.dataset.z === 'in') zoomAt(s * 1.5, cx, cy);
      if (b.dataset.z === 'out') zoomAt(s / 1.5, cx, cy);
      if (b.dataset.z === 'reset') zoomAt(1, cx, cy);
      if (b.dataset.z === 'close') this.close();
    });
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } },
};

    return new Promise(res => {

      img.onload = () => { const s = Math.min(1, 240 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .6)); };

function defaultProfile(p) {
  p = p || {};
  if (!p.avail || !Array.isArray(p.avail.grid)) p.avail = { grid: DAYS.map(() => Array(SLOTS).fill('')) };
  if (!p.exam) p.exam = { start:'', subjects:[] };
  if (!p.rounds) p.rounds = {};
  p.exam.subjects.forEach(s => { s.units = s.units || []; s.books = s.books || [{ id:uid(), name:'교과서' }]; s.goal = s.goal || 3; });
  return syncExam(p);
}
const newSubject = name => ({ id:uid(), name, target:'', date:'', period:'', range:'', goal:3, units:[], books:[{ id:uid(), name:'교과서' }] });
const teacherSchedule = () => (S.settings && S.settings.examSchedule) || [];

// 선생님이 정한 시험 일정(과목·날짜·교시·범위)을 내 계획에 자동으로 채워요
function syncExam(p) {
  const sch = teacherSchedule();
  if (!sch.length) return p;
  if (S.settings.examStart) p.exam.start = S.settings.examStart;
  sch.forEach(t => {
    let s = p.exam.subjects.find(x => x.name === t.name);
    if (!s) { s = newSubject(t.name); p.exam.subjects.push(s); }
    s.date = t.date; s.period = t.period; s.teacherRange = t.range;
    if (!s.range) s.range = t.range;
  });
  const order = n => { const i = sch.findIndex(t => t.name === n); return i < 0 ? 999 : i; };
  p.exam.subjects.sort((a, b) => order(a.name) - order(b.name));
  return p;
}
function fmtExamDay(s) {
  if (!s.date) return '';
  const d = parseYmd(s.date);
  return `${d.getMonth() + 1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})${s.period ? ' ' + s.period + '교시' : ''}`;
}

function levelOf(xp) {
  let i = 0;
  while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1].xp) i++;
  const cur = LEVELS[i], next = LEVELS[i + 1];
  return { idx:i, lv:i + 1, n:cur.n, e:cur.e, next, pct: next ? (xp - cur.xp) / (next.xp - cur.xp) : 1 };
}

const emptyDay = () => ({ study:0, planner:false, note:false, rounds:0, plannerSt:'', noteSt:'', qmade:0, game:0, qCorrect:0, credit:0, focus:0 });
function playInfo(l) {
  if (!l._p) { try { l._p = JSON.parse(l.m); } catch (e) { l._p = { n:l.v, ids:[] }; } }
  return l._p;
}

function computeStats(sid, logs, cap, qs) {
  qs = qs || S.questions || [];
  const today = todayStr();
  const days = {};
  const day = d => days[d] || (days[d] = emptyDay());
  const owner = {};
  qs.forEach(q => { owner[q.id] = q.sid; });
  const tips = new Set(), setups = new Set();
  let roundsNet = 0;
  // 내가 만든 문제 (선생님이 숨긴 문제는 XP 없음)
  qs.forEach(q => { if (q.sid === sid && q.st !== '숨김' && q.st !== '삭제') day(q.d).qmade++; });
  for (const l of logs) {
    if (l.type === 'QPLAY' && l.sid !== sid) {
      // 친구가 내 문제를 맞히면 출제자 보너스
      const mine = playInfo(l).ids.filter(id => owner[id] === sid).length;
      if (mine) day(l.d).credit += mine;
      continue;
    }
    if (l.sid !== sid || l.st === '반려') continue;
    const x = day(l.d);
    if (l.type === 'QPLAY') {
      const p = playInfo(l);
      const friend = id => owner[id] && owner[id] !== sid; // 내 문제는 XP 없음
      const got = p.ids.filter(friend).length;
      const half = (p.half || []).filter(friend).length; // 서술형 부분 정답
      x.qCorrect += got;
      x.game += got * XP.QCORRECT + half * XP.QHALF + (p.ids.length === p.n && p.n >= 5 && got === p.ids.length ? XP.QPERFECT : 0);
    }
    else if (l.type === 'STUDY') { x.study += l.v; if (l.st === '집중' && l.v >= 25) x.focus++; }
    else if (l.type === 'PLANNER') { x.planner = true; x.plannerSt = l.st === '승인' || x.plannerSt === '승인' ? '승인' : '대기'; }
    else if (l.type === 'NOTE') { x.note = true; x.noteSt = l.st === '승인' || x.noteSt === '승인' ? '승인' : '대기'; }
    else if (l.type === 'ROUND') { x.rounds += l.v; roundsNet += l.v; }
    else if (l.type === 'TIP') tips.add(l.m);
    else if (l.type === 'SETUP') setups.add(l.m);
  }
  let xp = 0, studyTotal = 0, perfectDays = 0, noteDays = 0;
  let qTotal = 0, qCorrectTotal = 0, creditTotal = 0, focusTotal = 0;
  const wk = weekStart(today), lwk = addDays(wk, -7);
  let week = 0, lastWeek = 0, weekRounds = 0, weekActive = 0, weekQMade = 0, weekQCorrect = 0;
  const active = d => !!days[d] && (days[d].study > 0 || days[d].planner || days[d].note);
  for (const d in days) {
    const x = days[d];
    const perfect = x.planner && x.note && x.study >= 30;
    xp += Math.min(x.study, cap) + (x.planner ? XP.PLANNER : 0) + (x.note ? XP.NOTE : 0) + (perfect ? XP.PERFECT : 0)
      + Math.min(x.qmade, LIMIT.QMAKE) * XP.QMAKE + Math.min(x.game, LIMIT.GAME)
      + Math.min(x.credit, LIMIT.QCREDIT) * XP.QCREDIT + Math.min(x.focus, LIMIT.FOCUS) * XP.FOCUS;
    studyTotal += x.study; perfectDays += perfect ? 1 : 0; noteDays += x.note ? 1 : 0;
    qTotal += x.qmade; qCorrectTotal += x.qCorrect; creditTotal += x.credit; focusTotal += x.focus;
    if (d >= wk && d <= today) { week += x.study; weekRounds += x.rounds; weekQMade += x.qmade; weekQCorrect += x.qCorrect; if (active(d)) weekActive++; }
    else if (d >= lwk && d < wk) lastWeek += x.study;
  }
  xp += Math.max(0, roundsNet) * XP.ROUND + tips.size * XP.TIP + setups.size * XP.SETUP;
  let streak = 0, d = today;
  if (!active(d)) d = addDays(d, -1);
  while (active(d)) { streak++; d = addDays(d, -1); }
  let bestStreak = 0, run = 0, prev = null;
  Object.keys(days).filter(active).sort().forEach(a => { run = prev && addDays(prev, 1) === a ? run + 1 : 1; bestStreak = Math.max(bestStreak, run); prev = a; });
  const t = days[today] || emptyDay();
  return { xp, studyTotal, perfectDays, noteDays, roundsNet, tips, setups, streak, bestStreak, week, lastWeek, weekRounds, weekActive,
    qTotal, qCorrectTotal, creditTotal, focusTotal, weekQMade, weekQCorrect, today:t, days };
}

/* =========================================================
   5. 타이머 (앱을 닫아도 이어서 계산돼요)
   ========================================================= */
const Timer = {
  key: () => 'timer_' + (S.me ? S.me.sid : ''),
  get() { return store.get(this.key(), { status:'idle', subject:'', startTs:0, acc:0 }); },
  set(t) { store.set(this.key(), t); },
  elapsed(t) { t = t || this.get(); return t.acc + (t.status === 'running' ? Date.now() - t.startTs : 0); },
  wake: null,
  async keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !this.wake) this.wake = await navigator.wakeLock.request('screen');
      if (!on && this.wake) { await this.wake.release(); this.wake = null; }
    } catch (e) {}
  },
};
function fmtClock(ms) {
  const s = Math.floor(ms / 1000);
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
}
setInterval(() => {
  if (!S.me) return;
  const t = Timer.get();
  const chip = $('#hdrTimer');
  if (chip) {
    const ms = Timer.elapsed(t);
    chip.classList.toggle('hidden', t.status === 'idle');
    chip.textContent = (t.status === 'running' ? '⏱ ' : '⏸ ') + fmtClock(ms).slice(ms >= 3600000 ? 0 : 3);
  }
  if (S.view === 'timer') paintTimer();
}, 1000);

// 집중 모드: 타이머를 켜 둔 채 앱 밖으로 나가면, 돌아왔을 때 양심 질문을 해요.
// (웹앱은 인스타·유튜브를 막을 수 없어서, 나간 걸 알아차리는 방식이에요)
document.addEventListener('visibilitychange', () => {
  if (!S.me) return;
  const t = Timer.get();
  if (t.status !== 'running' || !t.focus) return;
  if (document.hidden) { if (!t.awayStart) Timer.set({ ...t, awayStart:Date.now() }); }
  else checkAway();
});
function checkAway() {
  const t = Timer.get();
  if (t.status !== 'running' || !t.focus || !t.awayStart) return;
  const away = Date.now() - t.awayStart;
  Timer.set({ ...t, awayStart:0 });
  if (away < 15000) return; // 잠깐(15초 미만)은 봐줘요
  S.away = away;
  openModal(`<div class="center"><div style="font-size:56px">👀</div>
    <h2>${fmtAway(away)} 동안 앱 밖에 있었어!</h2>
    <p class="muted">그동안 뭐 했는지 양심껏 골라 줘 😉</p></div>
    <button class="btn blue block" data-act="awayStudy">📖 계속 공부했어 (화면만 꺼졌어)</button>
    <button class="btn ghost block mt12" data-act="awayApp">📱 딴 앱 봤어… 그 시간은 빼 줘</button>`);
}

function paintTimer() {
  const t = Timer.get();
  const ms = Timer.elapsed(t);
  const time = $('#ringTime'); if (!time) return;
  time.textContent = fmtClock(ms);
  const pomoMs = 25 * 60000;
  $('#ringArc').setAttribute('stroke-dashoffset', String(326.7 * (1 - (ms % pomoMs) / pomoMs)));
  const pomo = Math.floor(ms / pomoMs);
  $('#ringPomo').textContent = t.status === 'paused' ? '⏸ 일시정지' : pomo ? '🍅'.repeat(Math.min(pomo, 8)) + (pomo > 8 ? ' ×' + pomo : '') : (t.status === 'running' ? '집중 중…' : '');
  const fi = $('#focusInfo');
  if (fi) fi.textContent = t.status !== 'idle' && t.focus ? `켜짐${t.distract ? ' · 딴짓 ' + t.distract + '번' : ''}` : '';
  const btns = $('#timerBtns');
  const want = t.status;
  if (btns.dataset.st === want) return;
  btns.dataset.st = want;
  btns.innerHTML =
    want === 'idle' ? `<button class="btn" data-act="timerStart">▶ 시작</button>` :
    want === 'running' ? `<button class="btn yellow" data-act="timerPause">⏸ 일시정지</button><button class="btn blue" data-act="timerSave">■ 끝내고 저장</button><button class="btn ghost sm" data-act="timerReset">↺ 초기화</button>` :
    `<button class="btn" data-act="timerResume">▶ 계속</button><button class="btn blue" data-act="timerSave">■ 끝내고 저장</button><button class="btn ghost sm" data-act="timerReset">↺ 초기화</button>`;
}

/* ---------- 미니게임: 친구들이 만든 문제로 ---------- */
const activeQs = () => S.questions.filter(q => q.st === '공개' || !q.st);
function gamePool() {
  const pool = activeQs().filter(q => S.gameSubj === '전체' || q.subj === S.gameSubj);
  const others = pool.filter(q => q.sid !== S.me.sid);
  return others.length >= 4 ? others : pool; // 친구 문제가 적을 땐 내 문제도 섞어요 (내 문제는 XP 없음)
}
// 사진 문제 도전 = 사진이 있는 문제 (사진 주관식 + 사진 서술형), 서술형 도전 = 서술형 문제
function typePool(test) {
  const all = activeQs().filter(q => test(q) && (S.gameSubj === '전체' || q.subj === S.gameSubj));
  const others = all.filter(q => q.sid !== S.me.sid);
  return others.length ? others : all;
}

const essayPool = () => typePool(q => q.type === 'ESSAY');
const myPool = () => S.questions.filter(q => q.sid === S.me.sid && (q.st === '공개' || !q.st) && (S.mineSubj === '전체' || q.subj === S.mineSubj));

// 문제 → 퀴즈 한 칸으로 바꾸기
function quizItem(q, pool) {
  if (q.type === 'OX') return { q, kind:'choice', ox:true, prompt:q.q, choices:['O', 'X'], answer:q.a, label:'O / X' };
  if (q.type === 'MC') return { q, kind:'choice', prompt:q.q, choices:shuffle([q.a, ...q.opts]), answer:q.a, label:'객관식' };
  if (q.type === 'BLANK') return { q, kind:'type', prompt:q.q.replace(q.a, '( ＿＿＿ )'), answer:q.a, label:'빈칸 채우기' };
  if (q.type === 'PHOTO') {
    const alts = [q.a, ...(q.opts || [])].filter(Boolean);
    return { q, kind:'type', photo:true, prompt:q.q, answer:alts.join(' 또는 '), alts, label:'사진 문제' };
  }
  if (q.type === 'ESSAY') return { q, kind:'essay', photo:!!q.img, prompt:q.q, answer:q.a, kws:q.opts || [], label:'서술형' };
  if (q.type === 'PAIR') {
    const others = uniq(pool.filter(x => x.type === 'PAIR' && x.id !== q.id && x.a !== q.a).map(x => x.a));
    if (others.length < 2) return { q, kind:'type', prompt:`뜻을 보고 개념어를 써 봐!\n"${q.a}"`, answer:q.q, label:'개념어' };
    return { q, kind:'choice', prompt:`'${q.q}'의 뜻은?`, choices:shuffle([q.a, ...shuffle(others).slice(0, 3)]), answer:q.a, label:'개념어 뜻' };
  }
  if (q.type === 'ENG') {
    const others = uniq(pool.filter(x => x.type === 'ENG' && x.id !== q.id && x.a !== q.a).map(x => x.a));
    const words = q.q.split(/\s+/);
    const cand = words.map((w, i) => ({ w:w.replace(/[^A-Za-z'-]/g, ''), i })).filter(x => x.w.length >= 3);
    if (others.length >= 2 && (Math.random() < .4 || !cand.length)) {
      return { q, kind:'choice', prompt:q.q + '\n\n뜻으로 알맞은 것은?', choices:shuffle([q.a, ...shuffle(others).slice(0, 3)]), answer:q.a, label:'본문 해석' };
    }
    if (!cand.length) return null;
    const pick = cand[Math.floor(Math.random() * cand.length)];
    const shown = words.map((w, i) => i === pick.i ? w.replace(pick.w, '＿＿＿') : w).join(' ');
    return { q, kind:'type', prompt:shown, hint:q.a, answer:pick.w, label:'본문 빈칸' };
  }
  return null;
}
const isRight = (it, v) => it.kind === 'choice' ? v === it.answer
  : it.alts ? it.alts.some(a => norm(a) === norm(v)) : norm(v) === norm(it.answer);

// 사진 문제의 사진은 필요할 때 서버에서 불러와 기억해 둬요
const imgCache = {};
function qImg(id) {
  if (imgCache[id]) return imgCache[id];
  imgCache[id] = 'loading';
  api(S.view === 'admin' ? 'adminGetQuestionImage' : 'getQuestionImage', S.view === 'admin' ? S.admin.pw : S.token, id)
    .then(src => {
      imgCache[id] = src;
      // 입력 중인 답이 지워지지 않게 화면 전체가 아니라 사진 자리만 바꿔요
      document.querySelectorAll(`[data-qimg="${id}"]`).forEach(el => { el.innerHTML = photoInner(id); });
    })
    .catch(e => { imgCache[id] = 'error'; toast(e.message, 'err'); document.querySelectorAll(`[data-qimg="${id}"]`).forEach(el => { el.innerHTML = photoInner(id); }); });
  return 'loading';
}
function photoInner(id) {
  const src = imgCache[id];
  if (!src || src === 'loading') return '<div class="spinner" style="margin:50px auto"></div>';
  if (src === 'error') return '<div class="small muted" style="padding:40px">사진을 불러오지 못했어요 😢</div>';
  return `<img src="${src}" alt="문제 사진"><span class="zoomtag">🔍 눌러서 크게 보기</span>`;
}
const photoBox = id => { qImg(id); return `<div class="qphoto" data-qimg="${id}" data-act="zoomQ" data-v="${id}">${photoInner(id)}</div>`; };

function viewPlay() {
  const g = S.game;
  if (!g) return viewGames();
  if (g.done) return viewGameResult(g);
  const top = (label, right) => `<div class="row between" style="margin-bottom:8px"><button class="linkbtn" data-act="gameQuit">✕ 그만하기</button><span class="small muted">${label}</span><span class="xp">${right}</span></div>`;
  if (QUIZ_GAMES.includes(g.game)) {
    const it = g.items[g.i];
    const answered = g.picked != null;
    const essay = it.kind === 'essay';
    const hits = essay && answered ? essayHits(it, g.picked) : [];
    const ok = answered && (essay ? hits.length === it.kws.length : isRight(it, g.picked));
    const next = g.items[g.i + 1];
    if (next && next.photo) qImg(next.q.id); // 다음 사진 미리 불러오기
    const essayResult = () => `
      <div class="small mt12">내 답</div><div class="model" style="background:#fff;border:1px solid var(--line)">${esc(g.picked)}</div>
      <div class="result ${ok ? 'ok' : hits.length ? 'half' : 'no'}">
        ${ok ? '🎉 <b>핵심어를 모두 썼어!</b>' : hits.length ? `🙂 <b>부분 정답!</b> 핵심어 ${hits.length}/${it.kws.length}개` : '😢 핵심어가 하나도 없어. 모범 답안을 보고 다시 정리해 보자!'}
        <div class="kws">${it.kws.map(k => `<span class="kw ${hits.includes(k) ? 'hit' : ''}">${hits.includes(k) ? '✅' : '❌'} ${esc(k)}</span>`).join('')}</div>
      </div>
      <div class="model"><b>📘 모범 답안</b><br>${esc(it.answer)}</div>`;
    return top(`${g.i + 1} / ${g.n}`, `⭕ ${g.ids.length}${g.half.length ? ' · 🔺 ' + g.half.length : ''}`) + `
      <div class="bar"><i style="width:${(g.i + (answered ? 1 : 0)) / g.n * 100}%"></i></div>
      <div class="card mt12">
        <div class="row"><span class="tag">${it.label}</span><span class="tag">${esc(it.q.subj)}</span><span class="grow"></span><span class="small muted">출제: ${esc(it.q.name)}</span></div>
        ${it.photo ? photoBox(it.q.id) : ''}
        <div class="qprompt">${esc(it.prompt)}</div>
        ${it.hint ? `<div class="small muted mt8">뜻: ${esc(it.hint)}</div>` : ''}
        ${essay
          ? (answered ? essayResult() : `<textarea class="input mt12" id="essayAns" rows="4" placeholder="문장으로 답을 써 봐! 핵심어가 들어가야 점수를 받아."></textarea>
              <div class="row mt8"><span class="small muted grow">채점 기준 핵심어 ${it.kws.length}개</span><button class="btn" data-act="qEssay">제출</button></div>`)
          : it.kind === 'choice'
          ? `<div class="choices ${it.choices.length === 2 ? 'two' : ''}">${it.choices.map(c => `<button class="choice ${it.ox ? 'ox' : ''} ${answered ? (c === it.answer ? 'right' : c === g.picked ? 'wrong' : '') : ''}" data-act="qPick" data-v="${esc(c)}" ${answered ? 'disabled' : ''}>${it.ox ? (c === 'O' ? '⭕' : '❌') : esc(c)}</button>`).join('')}</div>`
          : answered ? `<div class="mt12 small">내 답: <b>${esc(g.picked)}</b></div>`
          : `<div class="row mt12"><input class="input grow" id="typeAns" autocomplete="off" autocapitalize="off" placeholder="정답 입력"><button class="btn" data-act="qTyped">확인</button></div>`}
        ${answered && !essay ? `<div class="result ${ok ? 'ok' : 'no'}">${ok ? '🎉 <b>정답!</b>' : `😢 아쉬워! 정답: <b>${esc(it.answer)}</b>`}${it.q.exp ? `<div class="small mt8">💡 ${esc(it.q.exp)}</div>` : ''}</div>` : ''}
        ${answered ? `
          <div class="row mt12"><button class="btn ghost sm" data-act="qReport" data-v="${it.q.id}" ${g.reported[it.q.id] ? 'disabled' : ''}>${g.reported[it.q.id] ? '신고함' : '🚩 문제 이상해요'}</button><span class="grow"></span>
          <button class="btn" data-act="qNext">${g.i + 1 < g.n ? '다음 →' : '결과 보기'}</button></div>` : ''}
      </div>`;
  }
  if (g.game === 'match') {
    return top(`짝 ${g.matched.length} / ${g.pairs.length}`, `실수 ${g.mistakes}`) + `
      <p class="small muted" style="margin:0 0 10px">파란 카드(개념어)와 노란 카드(뜻)를 짝지어 뒤집어!</p>
      <div class="mgrid">${g.cards.map((c, i) => {
        const done = g.matched.includes(c.pid), open = done || g.open.includes(i);
        return `<button class="mcard ${open ? 'open' : ''} ${c.side === 'm' ? 'm' : ''} ${done ? 'done' : ''}" data-act="mFlip" data-v="${i}">${open ? esc(c.text) : '?'}</button>`;
      }).join('')}</div>`;
  }
  const it = g.items[g.i];
  return top(`${g.i + 1} / ${g.n}`, `⭕ ${g.ids.length}`) + `
    <div class="card">
      <div class="small muted">뜻</div><div class="qprompt" style="margin-top:2px">${esc(it.q.a)}</div>
      <div class="answerline mt12">${g.chosen.map((k, j) => `<button class="tok" data-act="oUn" data-v="${j}" ${g.checked != null ? 'disabled' : ''}>${esc(it.toks[k])}</button>`).join('') || '<span class="small muted">아래 단어를 순서대로 눌러 봐</span>'}</div>
      <div class="tokens">${it.toks.map((w, k) => `<button class="tok ${g.chosen.includes(k) ? 'used' : ''}" data-act="oPick" data-v="${k}" ${g.checked != null ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
      ${g.checked == null
        ? `<div class="row mt16"><button class="btn ghost grow" data-act="oReset">↺ 다시</button><button class="btn grow" data-act="oCheck">확인</button></div>`
        : `<div class="result ${g.checked ? 'ok' : 'no'}">${g.checked ? '🎉 <b>완벽해!</b>' : '😢 아쉬워! 정답 문장:'}<div class="mt8" style="font-size:16px">${esc(it.q.q)}</div></div>
           <div class="row mt12"><button class="btn ghost sm" data-act="qReport" data-v="${it.q.id}" ${g.reported[it.q.id] ? 'disabled' : ''}>${g.reported[it.q.id] ? '신고함' : '🚩'}</button><span class="grow"></span><button class="btn" data-act="oNext">${g.i + 1 < g.n ? '다음 →' : '결과 보기'}</button></div>`}
    </div>`;
}

function viewGameResult(g) {
  const right = g.game === 'match' ? g.pairs.length - Math.min(g.mistakes, g.pairs.length) : g.ids.length;
  const total = g.game === 'match' ? g.pairs.length : g.n;
  const ratio = total ? right / total : 0;
  const detail = g.game === 'match' ? `${g.pairs.length}쌍 모두 찾았어! 실수 ${g.mistakes}번` : g.game === 'order' ? `${g.n}문장 중 ${g.ids.length}개 성공`
    : `${g.n}문제 중 ${g.ids.length}개 정답${g.half && g.half.length ? `, ${g.half.length}개 부분 정답` : ''}`;
  return `<div class="card center" style="padding:28px 18px">
    <div style="font-size:72px">${ratio >= .8 ? '🏆' : ratio >= .5 ? '👍' : '💪'}</div>
    <h2>${ratio >= .8 ? '대단해!' : ratio >= .5 ? '잘했어!' : '다음엔 더 잘할 수 있어!'}</h2>
    <p>${detail}</p>
    <div class="jua" style="font-size:24px;color:var(--pink)">${g.saving ? '저장 중…' : g.xpGained > 0 ? '+' + g.xpGained + ' XP' : ''}</div>
    ${g.game === 'mine' ? `<p class="small muted">내 문제 복습은 XP가 없어요. 틀린 문제는 교과서에 단권화해 두자! 📚</p>`
      : !g.saving && !(g.xpGained > 0) ? `<p class="small muted">오늘 게임 XP(${LIMIT.GAME})를 다 받았거나, 내가 만든 문제라서 XP가 없어요.</p>` : ''}
    <div class="row mt16"><button class="btn ghost grow" data-act="go" data-v="games">게임 목록</button><button class="btn grow" data-act="gameAgain">한 번 더!</button></div>
  </div>`;
}

async function finishGame() {
  const g = S.game;
  g.done = true; g.saving = true; render();
  try {
    const before = myStats();
    const log = await api('savePlay', S.token, g.game, Math.min(40, g.n), g.ids, g.half || []);
    S.logs.push(log);
    g.xpGained = myStats().xp - before.xp;
    g.saving = false;
    if (S.view === 'play') render();
    celebrate(before);
    if (g.ids.length === g.n && g.n >= 5) confetti();
  } catch (e) { g.saving = false; g.xpGained = 0; if (S.view === 'play') render(); toast(e.message, 'err'); }
}

function viewSetup() {
  const st = myStats();
  const steps = [
    ['time', '⏰', '공부 가능시간 찾기', '일주일 시간표에서 순수 공부시간을 찾아요'],
    ['exam', '🎯', '시험 과목 · 범위 · 목표', '시험 날짜, 범위, 목표 점수를 적어요'],

let painting = false;
window.addEventListener('pointerup', () => { if (painting) { painting = false; updateAvailSums(); } });
window.addEventListener('pointercancel', () => { if (painting) { painting = false; updateAvailSums(); } });
function bindAvailGrid() {
  const grid = $('#agrid'); if (!grid) return;
  const paintAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.classList.contains('c') || !grid.contains(el)) return;
    const d = +el.dataset.d, i = +el.dataset.i;
    if (S.avail[d][i] === S.paintCode) return;
    S.avail[d][i] = S.paintCode;
    el.className = 'c c-' + (S.paintCode || 'X');
  };
  let last = null;
  grid.addEventListener('pointerdown', e => {
    if (!S.paintMode || !e.target.classList.contains('c')) return;
    painting = true;
    try { e.target.releasePointerCapture(e.pointerId); } catch (_) {}
    last = { x:e.clientX, y:e.clientY };
    paintAt(last.x, last.y);
    e.preventDefault();
  });
  grid.addEventListener('pointermove', e => {
    if (!painting) return;
    // 빠르게 문질러도 중간 칸이 빠지지 않게 사이를 채워요
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
    for (let k = 1; k <= steps; k++) paintAt(last.x + dx * k / steps, last.y + dy * k / steps);
    last = { x:e.clientX, y:e.clientY };
  });
}
function updateAvailSums() {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function go(v) {
  S.view = v;
  if (v !== 'setup-time') S.avail = null;
  if (v !== 'setup-exam') S.examDraft = null;
  if (v !== 'setup-books') S.booksDraft = null;
  render();
  window.scrollTo(0, 0);
}

async function loadState() {
  const st = await api('getState', S.token);
  S.me = st.me; S.settings = st.settings; S.students = st.students; S.logs = st.logs; S.questions = st.questions || [];
  S.settings.examSchedule = S.settings.examSchedule || [];
  S.profile = defaultProfile(st.profile);
}

async function doSaveTimer(btn, min) {
  const t = Timer.get();
  await withBusy(btn, async () => {
    const before = myStats();
    const log = await api('saveStudy', S.token, t.subject, min, !!t.focus);
    S.logs.push(log);
    Timer.set({ status:'idle', subject:t.subject, startTs:0, acc:0 }); Timer.keepAwake(false);
    render();
    celebrate(before, `${t.subject} ${fmtMin(log.v)} 저장!${log.st === '집중' ? ' 🔒' : ''}`);
  });
}

function startGame(kind) {
  const pool = gamePool();
  // 퀴즈형 게임: 고른 문제들을 무작위로 섞어서 최대 10문제
  const quizGame = (game, qs, min, msg) => {
    const items = shuffle(qs).map(q => quizItem(q, activeQs())).filter(Boolean).slice(0, 10);
    if (items.length < min) { toast(msg, 'err'); return false; }
    S.game = { game, items, i:0, n:items.length, ids:[], half:[], picked:null, reported:{} };
    return true;
  };
  if (kind === 'quiz') { if (!quizGame('quiz', pool, 3, '문제가 조금 더 필요해요!')) return; }
  else if (kind === 'photo') { if (!quizGame('photo', photoPool(), 1, '사진 문제가 아직 없어요!')) return; }
  else if (kind === 'essay') { if (!quizGame('essay', essayPool(), 1, '서술형 문제가 아직 없어요!')) return; }
  else if (kind === 'mine') { if (!quizGame('mine', myPool(), 1, '복습할 내 문제가 없어요!')) return; }
  else if (kind === 'match') {
    const pairs = shuffle(pool.filter(q => q.type === 'PAIR')).slice(0, 6);
    if (pairs.length < 3) return toast('개념어 카드가 3개 이상 필요해요!', 'err');
    const cards = shuffle(pairs.flatMap(q => [{ pid:q.id, text:q.q, side:'t' }, { pid:q.id, text:q.a, side:'m' }]));
    S.game = { game:'match', pairs, cards, open:[], matched:[], mistakes:0, ids:[], n:0, reported:{} };
  } else {
    const es = shuffle(pool.filter(q => q.type === 'ENG')).slice(0, 5);
    if (!es.length) return toast('영어 본문 문장이 필요해요!', 'err');
    const scramble = s => { const w = s.trim().split(/\s+/); let r = w; for (let k = 0; k < 10 && w.length > 1 && r.join(' ') === w.join(' '); k++) r = shuffle(w); return r; };
    S.game = { game:'order', items:es.map(q => ({ q, toks:scramble(q.q) })), i:0, n:es.length, chosen:[], checked:null, ids:[], reported:{} };
  }
  go('play');
}

async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = '잠깐만…'; }
  try { await fn(); }
  catch (e) { toast(e.message || String(e), 'err'); if (/로그인이 (만료|필요)/.test(e.message)) logout(); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = btn.dataset.label; } }
}

function logout() {
  store.del(TOKEN_KEY); S.token = ''; S.me = null; S.view = 'home'; render();
}

async function saveProfileWith(patch, key, btn, next) {
  await withBusy(btn, async () => {
    const before = myStats();
    const profile = Object.assign(JSON.parse(JSON.stringify(S.profile)), patch);
    const log = await api('saveProfile', S.token, profile, key);
    S.profile = defaultProfile(Object.assign(profile, { rounds:S.profile.rounds }));
    if (log) S.logs.push(log);
    toast('저장했어요! ✨');
    celebrate(before);
    go(next);
  });
}

      render(); window.scrollTo(0, 0);
      celebrate(before, '문제 등록!');
      toast('친구들이 이제 이 문제를 풀 수 있어요 🎉');
    });
  },
  qDel: async el => {
    if (!confirm('이 문제를 지울까요? 이 문제로 받은 XP도 빠져요.')) return;
    await withBusy(el, async () => {
      await api('deleteQuestion', S.token, el.dataset.v);
      S.questions = S.questions.filter(q => q.id !== el.dataset.v);
      render();
    });
  },

  // 사진 인증
  pickPhoto: el => { const inp = $('#file-' + el.dataset.v); inp.value = ''; inp.click(); },
  sendPhoto: async el => {
    const kind = el.dataset.v;
    await withBusy(el, async () => {
      const before = myStats();
      const log = await api('uploadPhoto', S.token, kind, S.pending[kind]);
      S.logs.push(log); delete S.pending[kind];
      render();
      celebrate(before, '인증 완료!');
      if (!before.today[kind === 'PLANNER' ? 'planner' : 'note']) confetti();
    });
  },

  // 회독
  minus: el => { S.minus = el.dataset.v === '1'; render(); },
  toggleSubj: el => { S.openSubj[el.dataset.v] = S.openSubj[el.dataset.v] === false; render(); },
  round: async el => {
    const key = el.dataset.v, delta = S.minus ? -1 : 1;
    const cur = S.profile.rounds[key] || 0;
    if ((delta < 0 && cur === 0) || (delta > 0 && cur >= 10)) return toast(delta < 0 ? '이미 0이에요' : '최대 10회독까지예요!');
    const before = myStats();
    S.profile.rounds[key] = cur + delta; render();
    try {
      const r = await api('addRound', S.token, key, delta);
      S.profile.rounds[key] = r.count;
      if (r.log) S.logs.push(r.log);
      render();
      const s = S.profile.exam.subjects.find(x => key.startsWith(x.id + '|'));
      celebrate(before, delta > 0 && s && r.count === s.goal ? '⭐ 목표 회독 달성!' : '');
      if (delta > 0 && s && r.count === s.goal) confetti();
    } catch (e) { S.profile.rounds[key] = cur; render(); toast(e.message, 'err'); }
  },
  editBooks: () => go('setup-books'),

  // 랭킹
  rankTab: el => { S.rankTab = el.dataset.v; render(); },

  // 공부 가능시간
  paintCode: el => { S.paintCode = el.dataset.v; updateAvailSums(); },
  paintMode: el => { S.paintMode = el.dataset.v === '1'; updateAvailSums(); },
  copyMon: () => { for (let d = 1; d <= 4; d++) S.avail[d] = S.avail[0].slice(); updateAvailSums(); toast('월요일을 화~금에 복사했어요'); },
  saveTime: el => {
    if (!S.avail.some(col => col.includes('F'))) return toast('[순수 공부 가능] 칸을 하나 이상 칠해 주세요!', 'err');
    saveProfileWith({ avail:{ grid:S.avail } }, 'time', el, 'setup');
  },

  // 시험 정보
  examToggle: el => {
    const n = el.dataset.v, ex = S.examDraft;
    const i = ex.subjects.findIndex(s => s.name === n);
    if (i >= 0) ex.subjects.splice(i, 1); else ex.subjects.push(newSubject(n));
    render();
  },
  examAdd: () => {
    const v = $('#newSubj').value.trim(); if (!v) return;
    if (!S.examDraft.subjects.some(s => s.name === v)) S.examDraft.subjects.push(newSubject(v));
    render();
  },
  saveExam: el => {
    const ex = S.examDraft;
    // 이미 등록한 단원·교재는 그대로 유지
    ex.subjects.forEach(s => { const old = S.profile.exam.subjects.find(o => o.id === s.id); if (old) { s.units = old.units; s.books = old.books; s.goal = old.goal; } });
    saveProfileWith({ exam:ex }, 'exam', el, 'setup');
  },

  // 단원·교재
  bkAdd: el => {
    const [i, f] = el.dataset.v.split('|');
    const inp = $('#' + (f === 'units' ? 'unit-' : 'book-') + i);
    const v = inp.value.trim(); if (!v) return inp.focus();
    S.booksDraft[i][f].push({ id:uid(), name:v });
    const y = window.scrollY; render(); window.scrollTo(0, y);
    $('#' + (f === 'units' ? 'unit-' : 'book-') + i).focus();
  },
  bkDel: el => {
    const [i, f, id] = el.dataset.v.split('|');
    S.booksDraft[i][f] = S.booksDraft[i][f].filter(x => x.id !== id);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  saveBooks: el => {
    if (!S.booksDraft.some(s => s.units.length && s.books.length)) return toast('단원과 교재를 하나 이상 추가해 주세요!', 'err');
    const subjects = S.profile.exam.subjects.map(s => { const d = S.booksDraft.find(x => x.id === s.id); return d ? Object.assign({}, s, { units:d.units, books:d.books, goal:+d.goal || 3 }) : s; });
    saveProfileWith({ exam:Object.assign({}, S.profile.exam, { subjects }) }, 'books', el, 'rounds');
  },

  // 선생님
  adminOpen: () => { S.admin = {}; S.view = 'admin'; render(); },
  adminExit: () => { S.admin = null; S.view = 'home'; render(); },
  adminRefresh: async el => withBusy(el, async () => { S.admin.data = await api('adminGetData', S.admin.pw); render(); }),
  adminSt: async el => {
    const [id, st] = el.dataset.v.split('|');
    await withBusy(el, async () => {
      await api('adminSetStatus', S.admin.pw, id, st);
      const l = S.admin.data.logs.find(x => x.id === id); if (l) l.st = st;
      render();
    });
  },
  axAdd: () => { S.admin.exam.subjects.push({ name:'', date:'', period:'', range:'' }); render(); },
  axDel: el => { S.admin.exam.subjects.splice(+el.dataset.v, 1); render(); },
  axSave: async el => {
    const ex = S.admin.exam;
    if (!ex.subjects.some(s => s.name.trim())) return toast('과목을 하나 이상 넣어 주세요.', 'err');
    if (ex.subjects.some(s => s.name.trim() && !s.date) && !confirm('시험일이 비어 있는 과목이 있어요. 그래도 저장할까요?')) return;
    await withBusy(el, async () => {
      const settings = await api('adminSaveExam', S.admin.pw, ex);
      S.admin.data.settings = settings;
      S.admin.exam = null;
      render();
      toast('시험 일정을 저장했어요. 학생 앱에 바로 적용돼요! 📅');
    });
  },
  adminQSt: async el => {
    const [id, st] = el.dataset.v.split('|');
    await withBusy(el, async () => {
      await api('adminSetQuestionStatus', S.admin.pw, id, st);
      const q = S.admin.data.questions.find(x => x.id === id); if (q) { q.st = st; if (st === '공개') q.rep = 0; }
      render();
    });
  },
  adminQAll: () => { S.admin.qAll = true; render(); },
  adminReset: async el => {
    if (!confirm(el.dataset.v + ' 학생의 비밀번호를 초기화할까요?')) return;
    await withBusy(el, async () => { await api('adminResetPassword', S.admin.pw, el.dataset.v); toast('초기화했어요. 같은 학번으로 다시 가입하면 돼요.'); });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  ACT[el.dataset.act](el, e);
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fd = Object.fromEntries(new FormData(f));
  const btn = f.querySelector('button[type=submit]');
  if (f.id === 'authForm') {
    await withBusy(btn, async () => {
      const r = f.dataset.mode === 'join'
        ? await api('register', fd.code.trim(), fd.sid.trim(), fd.name.trim(), fd.pw)
        : await api('login', fd.sid.trim(), fd.pw);
      S.token = r.token; store.set(TOKEN_KEY, r.token);
      await loadState();
      S.view = f.dataset.mode === 'join' ? 'setup' : 'home';
      render();
      if (f.dataset.mode === 'join') { confetti(); toast('환영해요, ' + S.me.name + '! 🌱'); }
    });
  }
  if (f.id === 'adminForm') {
    await withBusy(btn, async () => { S.admin.pw = fd.pw; S.admin.data = await api('adminGetData', fd.pw); render(); });
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'qimgFile') {
    const file = el.files && el.files[0]; if (!file) return;
    try {
      // 글씨가 확대해도 잘 보이게 크게 저장 (체험 모드는 기기 저장 공간 때문에 조금 작게)
      S.qdraft.image = IS_LIVE ? await compressImage(file, 2000, .85) : await compressImage(file, 1000, .7);
      render();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (el.type === 'file' && el.dataset.kind) {
    const file = el.files && el.files[0]; if (!file) return;
    try { S.pending[el.dataset.kind] = await compressImage(file, 1600, .82); render(); }
    catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (el.dataset.exam === 'start') S.examDraft.start = el.value;
  if (el.dataset.sub != null) S.examDraft.subjects[+el.dataset.sub][el.dataset.f] = el.value;
  if (el.dataset.bk != null) S.booksDraft[+el.dataset.bk][el.dataset.f] = +el.value;
  if (el.id === 'adminDate') { S.admin.date = el.value; render(); }
  if (el.id === 'onlyPending') { S.admin.onlyPending = el.checked; render(); }
  bindDraftInput(el);
});
// 입력하는 동안 화면을 다시 그리지 않고 초안에만 저장해요 (글자 입력이 끊기지 않게)
function bindDraftInput(el) {
  if (el.dataset.sub != null && S.examDraft) S.examDraft.subjects[+el.dataset.sub][el.dataset.f] = el.value;
  if (el.dataset.qf && S.qdraft) {
    const f = el.dataset.qf;
    if (f.startsWith('opt')) S.qdraft.opts[+f.slice(3)] = el.value; else S.qdraft[f] = el.value;
  }
  if (el.dataset.ax && S.admin && S.admin.exam) {
    if (el.dataset.ax === 'start') S.admin.exam.start = el.value;
    else { const [i, f] = el.dataset.ax.split('|'); S.admin.exam.subjects[+i][f] = el.value; }
  }
}
document.addEventListener('input', e => bindDraftInput(e.target));
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id || '';
  if (id === 'newSubj') { e.preventDefault(); ACT.examAdd(); }
  if (id === 'typeAns') { e.preventDefault(); ACT.qTyped(); }
  const m = id.match(/^(unit|book)-(\d+)$/);
  if (m) { e.preventDefault(); ACT.bkAdd({ dataset:{ v:m[2] + '|' + (m[1] === 'unit' ? 'units' : 'books') } }); }
});

/* =========================================================
   8. 시작
   ========================================================= */
(async function init() {
  if (!IS_LIVE) $('#demoBar').classList.remove('hidden');
  if (!S.token) return render();
  $('#app').innerHTML = '<div class="spinner"></div>';
  try { await loadState(); }
  catch (e) { store.del(TOKEN_KEY); S.token = ''; toast(e.message, 'err'); }
  render();
  if (S.me) checkAway(); // 집중 모드 중에 앱을 완전히 닫았다가 다시 연 경우
})();
</script>
</body>
</html>
